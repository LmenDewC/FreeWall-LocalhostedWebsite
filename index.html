<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Free Wall</title>

    <link rel="stylesheet" href="/style.css">

</head>


<body>

<header>

    <h1>Free Wall</h1>

    <p>A wall for everyone in the dorm</p>

</header>


<main>

    <section>

        <div class="wall-header">

            <h2>Posts</h2>

            <a
                href="/addpost/"
                class="add-post-button"
            >
                + Add Post
            </a>

        </div>


        <div id="post-list">

            <p>Loading posts...</p>

        </div>

    </section>

</main>


<footer>

</footer>


<script>

async function loadPosts() {

    const container =
        document.getElementById(
            "post-list"
        );


    try {

        const response =
            await fetch(
                "/api/posts"
            );


        if (!response.ok) {

            throw new Error(
                "Server returned an error"
            );

        }


        const posts =
            await response.json();


        container.innerHTML = "";


        if (posts.length === 0) {

            container.innerHTML =
                "<p>No posts yet. Be the first!</p>";

            return;

        }


        posts.forEach(
            post => {

                const article =
                    document.createElement(
                        "article"
                    );


                article.className =
                    "announcement";


                const alias =
                    document.createElement(
                        "h3"
                    );


                alias.textContent =
                    post.alias;


                const message =
                    document.createElement(
                        "p"
                    );


                message.textContent =
                    post.message;


                const date =
                    document.createElement(
                        "small"
                    );


                date.textContent =
                    new Date(
                        post.created
                    ).toLocaleString();


                article.appendChild(
                    alias
                );


                article.appendChild(
                    message
                );


                article.appendChild(
                    date
                );


                container.appendChild(
                    article
                );

            }
        );


    } catch (error) {

        container.innerHTML =
            "<p>Unable to connect to the Free Wall.</p>";

        console.error(error);

    }

}


// Load posts immediately
loadPosts();


// Check for new posts every 10 seconds
setInterval(
    loadPosts,
    10000
);

</script>

</body>

</html>
